[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurointent"
version = "0.1.0"
description = "Reproducible EEG motor-imagery decoding with held-out-run evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "mne>=1.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neurointent = "neurointent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
